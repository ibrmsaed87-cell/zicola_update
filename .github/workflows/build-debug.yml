name: Build Zicola Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore original keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zicola-upload-key-v2.jks"

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zicola-upload-key-v2.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB 16 KB page-size readiness
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$AAB"
          echo "Checking native libraries in $AAB"
          unzip -l "$AAB" | awk '{print $4}' | grep -E '\\.so$' > "$RUNNER_TEMP/native-libs.txt" || true
          if [ -s "$RUNNER_TEMP/native-libs.txt" ]; then
            echo "Native libraries found:"
            cat "$RUNNER_TEMP/native-libs.txt"
            echo "Modern AGP packaging is enabled; Google Play will perform final 16 KB validation on upload."
          else
            echo "PASS: No native .so libraries found. No native ELF page-alignment issue applies."
          fi

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: zicola-play-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
